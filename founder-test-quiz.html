<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Type of Founder Are You? — RuangImprove</title>
<style>
  :root{
    --ink:#1b1730;
    --bg:#faf7f2;
    --card:#ffffff;
    --accent:#5b3df5;
    --accent-soft:#efeaff;
    --hacker:#1f8a70;
    --hipster:#c9781a;
    --hustler:#c0355f;
    --line:#e7e2d8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .app{
    width:100%; max-width:520px; background:var(--card);
    border-radius:20px; box-shadow:0 20px 60px rgba(27,23,48,0.08);
    overflow:hidden; border:1px solid var(--line);
  }
  .progress-wrap{ height:6px; background:var(--accent-soft); }
  .progress-bar{ height:100%; width:0%; background:var(--accent); transition:width .35s ease; }
  .step{ padding:36px 32px 32px; display:none; animation:fade .3s ease; }
  .step.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  h1{ font-size:28px; line-height:1.15; margin:0 0 12px; }
  h2{ font-size:22px; line-height:1.25; margin:0 0 22px; }
  p.sub{ color:#6b6580; font-size:15px; margin-top:0; }
  .btn{
    appearance:none; border:none; cursor:pointer; font-weight:700; font-size:15px;
    padding:14px 22px; border-radius:12px; width:100%; margin-top:8px;
    background:var(--accent); color:#fff; transition:transform .15s ease, opacity .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  .btn.ghost{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
  input[type=text], input[type=email]{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line);
    font-size:15px; margin-bottom:14px; background:#fff; color:var(--ink);
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .option{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px;
    border:1.5px solid var(--line); margin-bottom:10px; cursor:pointer; transition:.15s ease;
  }
  .option:hover{ border-color:var(--accent); }
  .option.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .option .dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; position:relative; }
  .option.selected .dot{ border-color:var(--accent); }
  .option.selected .dot::after{
    content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
  }
  .swatch{
    width:28px; height:28px; border-radius:8px; flex-shrink:0;
    border:1px solid rgba(0,0,0,0.08);
  }
  .color-block{
    width:100%; height:160px; border-radius:14px; margin-bottom:20px;
    border:1px solid rgba(0,0,0,0.06);
  }
  .meta{ display:flex; justify-content:space-between; font-size:12px; color:#948e9f; margin-bottom:6px; }
  .footer-nav{ display:flex; gap:10px; margin-top:18px; }
  .footer-nav .btn{ margin-top:0; }
  .result-badge{
    display:inline-block; padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px;
    color:#fff; margin-bottom:16px;
  }
  .share-row{ display:flex; gap:10px; margin-top:20px; }
  .share-row a{
    flex:1; text-align:center; padding:12px; border-radius:10px; border:1.5px solid var(--line);
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600;
  }
  .debug{ font-size:12px; color:#a49dae; margin-top:18px; border-top:1px dashed var(--line); padding-top:14px; }
  .debug code{ background:var(--accent-soft); padding:2px 5px; border-radius:5px; }
</style>
</head>
<body>

<div class="app">
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="steps"></div>
</div>

<script>
/* ============================================================
   1) DATA MODEL
   - `questions` drives everything: rendering + scoring.
   - each option has a `type` = which founder archetype it scores.
   - this is the piece you'd normally keep in a CMS/JSON/db table
     called something like `quiz_questions`.
   ============================================================ */
const questions = [
  {
    id: "q2", text: "What do you eat for breakfast?",
    options: [
      { label: "Whatever is in my fridge", type: "hacker" },
      { label: "Home made cereal or toast", type: "hustler" },
      { label: "Coffee", type: "hipster" },
    ]
  },
  {
    id: "q3", text: "In a team meeting I am most likely to be:",
    options: [
      { label: "Listening quietly", type: "hacker" },
      { label: "Talking and taking notes", type: "hustler" },
      { label: "Doodling", type: "hipster" },
    ]
  },
  {
    id: "q4", text: "I have:",
    options: [
      { label: "A few best friends", type: "hipster" },
      { label: "Lots of friends / friend groups", type: "hustler" },
      { label: "A small diverse group of close friends", type: "hacker" },
    ]
  },
  {
    id: "q5", text: "This colour is:",
    visual: { type: "color", value: "rgb(0,255,255)" },
    options: [
      { label: "R:0 G:255 B:255", type: "hustler" },
      { label: "Nice and bright", type: "hacker" },
      { label: "A comfortable blend of colours that creates a nice feeling", type: "hipster" },
    ]
  },
  {
    id: "q6", text: "If you had lots of money would you prefer to shop at:",
    options: [
      { label: "Uniqlo", type: "hipster" },
      { label: "Hugo Boss", type: "hustler" },
      { label: "A boutique", type: "hacker" },
    ]
  },
  {
    id: "q7", text: "Are you someone who:",
    options: [
      { label: "Has one focus at a time", type: "hustler" },
      { label: "Juggles lots of things at once", type: "hacker" },
      { label: "Thinks about all the details before commencing", type: "hipster" },
    ]
  },
  {
    id: "q8", text: "Steve Jobs was:",
    options: [
      { label: "A technical genius", type: "hacker" },
      { label: "A business genius", type: "hustler" },
      { label: "A design genius", type: "hipster" },
    ]
  },
];

const results = {
  hacker: {
    title: "Hacker",
    color: "#1f8a70",
    desc: "The Hacker develops the new technology for the business, builds new product prototypes, and works on product development."
  },
  hipster: {
    title: "Hipster",
    color: "#c9781a",
    desc: "The Hipster shapes how the product looks and feels — obsessed with design, user experience, and the story the brand tells."
  },
  hustler: {
    title: "Hustler",
    color: "#c0355f",
    desc: "The Hustler drives the business forward — sales, deals, partnerships, and making sure the product actually reaches people."
  },
};

// Builds the display object for either a single winner (["hacker"])
// or a tie between 2-3 types (["hacker","hustler"]). No forced
// tie-breaking question — a tie is shown as an honest hybrid.
function buildResultDisplay(winnerKeys) {
  if (winnerKeys.length === 1) {
    const r = results[winnerKeys[0]];
    return {
      title: `The ${r.title}`,
      color: r.color,
      desc: r.desc,
    };
  }
  const parts = winnerKeys.map(k => results[k]);
  return {
    title: parts.map(p => p.title).join("-"),
    color: parts[0].color, // badge uses the first tied colour
    desc: `You're a hybrid: ${parts.map(p => p.desc).join(" ")}`,
  };
}

/* ============================================================
   2) STATE
   In a real app this state would live in React (useState) or
   a form library. Here it's just a plain object.
   ============================================================ */
const state = {
  currentStep: 0,      // 0 = intro
  name: "",
  email: "",
  answers: {},          // { q2: "hacker", q3: "hipster", ... }
};

// total steps = intro + name/email + N questions + result
const totalSteps = 2 + questions.length + 1;

/* ============================================================
   3) SCORING LOGIC — the actual "backend logic" of the quiz
   ============================================================ */
function computeResult(answers) {
  const tally = { hacker: 0, hipster: 0, hustler: 0 };
  Object.values(answers).forEach(type => tally[type]++);

  // sort types by score, descending
  const ranked = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const topScore = ranked[0][1];
  const winners = ranked
    .filter(([, score]) => score === topScore)
    .map(([type]) => type);

  // tie-breaker: if two (or three) types are tied for first,
  // the result is a hybrid of all tied types — no single
  // "deciding" question, just an honest reflection of the mix.
  // e.g. ["hacker", "hustler"] instead of forcing one winner.
  return winners; // always an array, even when there's a single winner
}

/* ============================================================
   4) "SUBMIT" — where the backend call would go.
   Right now this just logs to console. In production you'd
   POST this to an API route, e.g.:

   await fetch('/api/submit-quiz', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ name, email, result, answers })
   });

   That API route then writes to your database or a Google Sheet.
   ============================================================ */
function submitLead(payload) {
  console.log("Would POST to /api/submit-quiz:", payload);
}

/* ============================================================
   5) RENDERING
   ============================================================ */
const stepsEl = document.getElementById("steps");
const progressBar = document.getElementById("progressBar");

function render() {
  progressBar.style.width = `${(state.currentStep / (totalSteps - 1)) * 100}%`;
  stepsEl.innerHTML = "";

  if (state.currentStep === 0) return renderIntro();
  if (state.currentStep === 1) return renderNameEmail();
  const qIndex = state.currentStep - 2;
  if (qIndex < questions.length) return renderQuestion(questions[qIndex], qIndex);
  return renderResult();
}

function renderIntro() {
  stepsEl.innerHTML = `
    <div class="step active">
      <div class="eyebrow">Quiz · 45 sec</div>
      <h1>What Type of Founder Are You?</h1>
      <p class="sub">Jawab 7 pertanyaan singkat dan cari tahu apakah kamu seorang Hacker, Hipster, atau Hustler.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  `;
  document.getElementById("startBtn").onclick = () => go(1);
}

function renderNameEmail() {
  stepsEl.innerHTML = `
    <div class="step active">
      <div class="meta"><span>Step 1 of ${questions.length + 1}</span></div>
      <h2>What's your name and email?</h2>
      <input type="text" id="nameInput" placeholder="Type your name here" value="${state.name}">
      <input type="email" id="emailInput" placeholder="Type your email here" value="${state.email}">
      <div class="footer-nav">
        <button class="btn" id="nextBtn">Next</button>
      </div>
    </div>
  `;
  const nameInput = document.getElementById("nameInput");
  const emailInput = document.getElementById("emailInput");
  const nextBtn = document.getElementById("nextBtn");

  function validate() {
    const emailOk = /\S+@\S+\.\S+/.test(emailInput.value);
    nextBtn.disabled = !(nameInput.value.trim() && emailOk);
  }
  nameInput.oninput = validate;
  emailInput.oninput = validate;
  validate();

  nextBtn.onclick = () => {
    state.name = nameInput.value.trim();
    state.email = emailInput.value.trim();
    go(2);
  };
}

function renderQuestion(question, qIndex) {
  const selected = state.answers[question.id];
  const visualHtml = question.visual && question.visual.type === "color"
    ? `<div class="color-block" style="background:${question.visual.value}"></div>`
    : "";
  stepsEl.innerHTML = `
    <div class="step active">
      <div class="meta"><span>Step ${qIndex + 2} of ${questions.length + 1}</span></div>
      <h2>${qIndex + 2}. ${question.text}</h2>
      ${visualHtml}
      <div id="optionsWrap"></div>
      <div class="footer-nav">
        <button class="btn ghost" id="backBtn">Back</button>
        <button class="btn" id="nextBtn" ${selected ? "" : "disabled"}>Next</button>
      </div>
    </div>
  `;
  const wrap = document.getElementById("optionsWrap");
  question.options.forEach((opt) => {
    const div = document.createElement("div");
    div.className = "option" + (selected === opt.type ? " selected" : "");
    div.innerHTML = `<div class="dot"></div><span>${opt.label}</span>`;
    div.onclick = () => {
      state.answers[question.id] = opt.type;
      render();
    };
    wrap.appendChild(div);
  });

  document.getElementById("backBtn").onclick = () => go(state.currentStep - 1);
  document.getElementById("nextBtn").onclick = () => go(state.currentStep + 1);
}

function renderResult() {
  const winnerKeys = computeResult(state.answers); // e.g. ["hacker"] or ["hacker","hustler"]
  const r = buildResultDisplay(winnerKeys);
  const resultKey = winnerKeys.join("-"); // "hacker" or "hacker-hustler"

  submitLead({
    name: state.name,
    email: state.email,
    result: resultKey,
    answers: state.answers,
  });

  const shareText = encodeURIComponent(`I'm ${r.title}! What type of founder are you?`);
  const pageUrl = encodeURIComponent(window.location.href);

  stepsEl.innerHTML = `
    <div class="step active">
      <div class="eyebrow">Your result</div>
      <span class="result-badge" style="background:${r.color}">${r.title}</span>
      <h1>You are ${r.title}!</h1>
      <p class="sub">${r.desc}</p>
      <div class="share-row">
        <a href="https://www.facebook.com/sharer/sharer.php?u=${pageUrl}" target="_blank">Facebook</a>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${pageUrl}" target="_blank">X</a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}" target="_blank">LinkedIn</a>
      </div>
      <div class="debug">
        Debug — tally dari jawaban kamu: <code>${JSON.stringify(tallyOf(state.answers))}</code><br>
        Data yang (nantinya) dikirim ke backend: <code>{name, email, result: "${resultKey}"}</code>
      </div>
    </div>
  `;
}

function tallyOf(answers) {
  const t = { hacker: 0, hipster: 0, hustler: 0 };
  Object.values(answers).forEach(type => t[type]++);
  return t;
}

function go(step) {
  state.currentStep = step;
  render();
}

render();
</script>
</body>
</html>
